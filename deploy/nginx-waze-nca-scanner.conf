# Host nginx vhost — install with:
#   sudo cp deploy/nginx-waze-nca-scanner.conf /etc/nginx/sites-available/waze-nca-scanner
#   sudo ln -sf /etc/nginx/sites-available/waze-nca-scanner /etc/nginx/sites-enabled/waze-nca-scanner
#   sudo certbot --nginx -d waze-nca-scanner.ster.by
#   sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  listen [::]:80;
  server_name waze-nca-scanner.ster.by;

  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
