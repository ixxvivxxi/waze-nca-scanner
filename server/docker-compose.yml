services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nca-scanner-db
    environment:
      POSTGRES_USER: nca
      POSTGRES_PASSWORD: nca
      POSTGRES_DB: nca_scanner
    ports:
      - '5433:5432'
    volumes:
      - nca_scanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nca -d nca_scanner']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nca_scanner_pgdata:
